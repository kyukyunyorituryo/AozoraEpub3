plugins {
    id 'java'
    id 'application'
}
// compileJavaタスクのエンコーディング
compileJava.options.encoding = 'UTF-8'
// compileTestJavaタスクのエンコーディング
compileTestJava.options.encoding = 'UTF-8'
// javadocタスクのエンコーディング
javadoc.options.encoding = 'UTF-8'
//mainClassName = 'AozoraEpub3Applet'
ant.importBuild 'ant.xml'
repositories {
    mavenCentral()
}
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs= ["src"]
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}
test {
    useJUnit()
}
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}
application {
    // Define the main class for the application.
    mainClass.set('AozoraEpub3Applet')
}
jar {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
      //  attributes 'Main-Class': 'AozoraEpub3'
        attributes 'Main-Class': 'AozoraEpub3Applet'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
/*        */
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.register('jpackageMsi', Exec) {
    dependsOn 'jar','copy_runtime_files'

    def inputDir = file('out')
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile

    doFirst {
        inputDir.mkdirs()
        outputDir.mkdirs()

        copy {
            from 'build/libs/AozoraEpub3.jar'
            into inputDir
        }
    }

    commandLine 'jpackage',
            '--type', 'msi',
            '--win-menu',
            '--win-dir-chooser',
            '--win-shortcut',
            '--win-shortcut-prompt',
            '--copyright', 'kyukyunyorituryo',
            '--icon', 'AozoraEpub3.ico',
            '--app-version', '1.1.1.34',
            '--description', '改造版AozoraEpub3 青空文庫テキストePub3変換',
            '-n', 'AozoraEpub3',
            '--main-jar', 'AozoraEpub3.jar',
            '--input', inputDir.absolutePath,
            '--dest', outputDir.absolutePath
}


dependencies {
// https://mvnrepository.com/artifact/org.apache.velocity/velocity-engine-core
    implementation group: 'org.apache.velocity', name: 'velocity-engine-core', version: '2.4.1'

// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'

// Source: https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.18'
// Source: https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.18'
// https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.5.0'
// Source: https://mvnrepository.com/artifact/org.apache.commons/commons-text
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.15.0'

// Source: https://mvnrepository.com/artifact/com.github.junrar/junrar
    implementation group: 'com.github.junrar', name: 'junrar', version: '7.6.1'
// Source: https://mvnrepository.com/artifact/org.jsoup/jsoup
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.23.1'
// https://mvnrepository.com/artifact/org.apache.commons/commons-compress
    implementation group: 'org.apache.commons', name: 'commons-compress', version: '1.28.0'
// Source: https://mvnrepository.com/artifact/commons-cli/commons-cli
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.11.0'
// https://mvnrepository.com/artifact/com.github.albfernandez/juniversalchardet
    implementation group: 'com.github.albfernandez', name: 'juniversalchardet', version: '2.5.0'
// Source: https://mvnrepository.com/artifact/org.json/json
    implementation group: 'org.json', name: 'json', version: '20260719'
// Source: https://mvnrepository.com/artifact/com.twelvemonkeys.imageio/imageio-webp
    implementation group: 'com.twelvemonkeys.imageio', name: 'imageio-webp', version: '3.14.0'
    testImplementation 'junit:junit:4.13.2'
}